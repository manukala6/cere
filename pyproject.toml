[project]
name = "cere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.10.2",
    "bottleneck>=1.6.1",
    "dask>=2026.8.0",
    "geocube>=0.8.0",
    "geopandas>=1.2.0",
    "graphviz>=0.21",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "prefect>=3.9.3",
    "pyfixest>=0.70.0",
    "requests>=2.34.2",
    "rioxarray>=0.24.0",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "xesmf>=0.9.2",
    "zarr>=3.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
